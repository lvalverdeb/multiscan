[workspace]
resolver = "2"
members = [
    "crates/multiscan",
    "crates/multiscan-core",
    "crates/multiscan-engine",
    "crates/multiscan-scope",
    "crates/multiscan-feeds",
    "crates/multiscan-dedup",
    "crates/multiscan-risk",
    "crates/multiscan-store",
    "crates/multiscan-report",
    "crates/engines/multiscan-sca",
    "crates/engines/multiscan-secrets",
    "crates/engines/multiscan-iac",
    "crates/engines/multiscan-probe",
    "crates/engines/multiscan-sast",
    "crates/engines/multiscan-bridge",
    "xtask",
]
# xtask is excluded so `cargo build/test` never compiles dev tooling into the product.
default-members = [
    "crates/multiscan",
    "crates/multiscan-core",
    "crates/multiscan-engine",
    "crates/multiscan-scope",
    "crates/multiscan-feeds",
    "crates/multiscan-dedup",
    "crates/multiscan-risk",
    "crates/multiscan-store",
    "crates/multiscan-report",
    "crates/engines/multiscan-sca",
    "crates/engines/multiscan-secrets",
    "crates/engines/multiscan-iac",
    "crates/engines/multiscan-probe",
    "crates/engines/multiscan-sast",
    "crates/engines/multiscan-bridge",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
# Internal crates — path deps, single declaration point (no per-crate version drift).
multiscan-core = { path = "crates/multiscan-core", version = "0.2.0" }
multiscan-engine = { path = "crates/multiscan-engine", version = "0.2.0" }
multiscan-scope = { path = "crates/multiscan-scope", version = "0.2.0" }
multiscan-feeds = { path = "crates/multiscan-feeds", version = "0.2.0" }
multiscan-dedup = { path = "crates/multiscan-dedup", version = "0.2.0" }
multiscan-risk = { path = "crates/multiscan-risk", version = "0.2.0" }
multiscan-store = { path = "crates/multiscan-store", version = "0.2.0" }
multiscan-report = { path = "crates/multiscan-report", version = "0.2.0" }
multiscan-sca = { path = "crates/engines/multiscan-sca", version = "0.2.0" }
multiscan-secrets = { path = "crates/engines/multiscan-secrets", version = "0.2.0" }
multiscan-iac = { path = "crates/engines/multiscan-iac", version = "0.2.0" }
multiscan-probe = { path = "crates/engines/multiscan-probe", version = "0.2.0" }
multiscan-sast = { path = "crates/engines/multiscan-sast", version = "0.2.0" }
multiscan-bridge = { path = "crates/engines/multiscan-bridge", version = "0.2.0" }

# External
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
rayon = "1"
indexmap = { version = "2", features = ["serde"] }
toml = "0.8"
regex = "1"
globset = "0.4"
hcl-rs = "0.19"
serde_yaml_ng = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
pep440_rs = "0.7"
debversion = "0.5"
rpm = { version = "0.18", default-features = false }
psl = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Network (feeds + probe only; scan targets go through multiscan-scope, R-6).
# ureq 3 = blocking + rustls/ring — no async runtime, no aws-lc build deps.
ureq = "3"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tar = "0.4"
zstd = "0.13"
ed25519-dalek = "2"
getrandom = "0.2"
cap-std = "4"
sha2 = "0.10"

# Dev/test
proptest = "1"
tempfile = "3"

[workspace.lints.rust]
# NFR-009: zero unsafe in first-party code. Workspace-level forbid, inherited by
# every member via `[lints] workspace = true` (verified by `cargo xtask purity`).
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
# No unwrap/expect/panic outside tests, xtask, and main (CLAUDE.md conventions).
# Test allowances live in clippy.toml; xtask carries crate-level allows.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# DET-001 (HashMap ban) and the pure-crate I/O bans; type/method lists in clippy.toml.
disallowed_types = "deny"
disallowed_methods = "deny"

[profile.release]
# NFR-004: <30 MB stripped binary.
lto = true
codegen-units = 1
strip = true
