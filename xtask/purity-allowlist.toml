# Transitive normal-dependency allowlist for the pure crates (spec 5.2).
# `cargo xtask purity` fails if any of these crates gains a dependency not
# listed here. Every addition is a reviewable event — think before you allow:
# nothing here may perform I/O, read clocks, or touch the environment on the
# pure crates' behalf.
#
# Workspace-internal deps are not listed; pure crates may depend only on other
# pure crates (enforced separately).

# serde + serde_json for the generated types (R-4). The rest is their
# transitive closure: derive machinery (build-time proc-macros) and the
# int/float/byte-search formatting primitives. None perform I/O.
[multiscan-core]
allow = [
    "serde",
    "serde_core",
    "serde_derive",
    "serde_json",
    "itoa",
    "memchr",
    "zmij",
    "proc-macro2",
    "quote",
    "syn",
    "unicode-ident",
]

[multiscan-dedup]
allow = []

[multiscan-risk]
allow = []
