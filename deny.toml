# cargo-deny configuration — licenses, advisories, bans (spec §16 supply chain).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# First-party crates are publish = false; the product's own license is a
# separate decision, not cargo-deny's concern.
private = { ignore = true }
# A-2: every dependency license is recorded and reviewed. Additions here are a
# reviewable event.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # NFR-008: static musl builds — no OpenSSL, rustls only.
    { crate = "openssl-sys", reason = "rustls only (NFR-008)" },
    { crate = "native-tls", reason = "rustls only (NFR-008)" },
    # Architecture decision: no async runtime in v1 (NFR-004/005, plan §HTTP stack).
    { crate = "tokio", reason = "no async runtime in v1; blocking ureq stack" },
    { crate = "async-std", reason = "no async runtime in v1" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
