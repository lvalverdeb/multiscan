# cargo-fuzz targets. Detached from the main workspace (its own [workspace])
# so the fuzzing toolchain and libfuzzer-sys never enter the product build.
# Run with: cargo +nightly fuzz run tar_extract  (release-blocking, NFR-010).
[package]
name = "multiscan-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3"
multiscan-sca = { path = "../crates/engines/multiscan-sca" }
multiscan-sast = { path = "../crates/engines/multiscan-sast" }

# The fuzz harness requires unsafe; it is not first-party product code, so
# NFR-009 (forbid unsafe in first-party crates) does not apply here.

[[bin]]
name = "tar_extract"
path = "fuzz_targets/tar_extract.rs"
test = false
doc = false
bench = false

# SAST parsing and matching (T-704). Release-blocking per ADR 0015 decision 4:
# both front-ends carry unsafe in the parse path, and that is the condition on
# which those parsers were accepted.
[[bin]]
name = "sast_parse"
path = "fuzz_targets/sast_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sast_match"
path = "fuzz_targets/sast_match.rs"
test = false
doc = false
bench = false
